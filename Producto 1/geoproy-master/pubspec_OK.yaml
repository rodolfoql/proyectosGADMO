name: geoproy
description: "Sistema Georeferenciado de Seguimiento de Obras Publicas Verificables"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  icons_plus: ^5.0.0
  clay_containers: ^0.3.2
  circular_menu: ^4.0.0
  fab_circular_menu_plus: ^0.0.3
  google_fonts: ^6.1.0

  http: ^1.1.0
  dio: ^5.3.0
  html: ^0.15.0
  # ACTUALIZADO PARA EVITAR V1 EMBEDDING
  postgres: ^3.0.0
  password_dart: ^2.0.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

  image_picker: ^1.0.7
  image: ^4.1.3
  record: 5.0.0
  audioplayers: ^5.2.1

  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_polyline_points: ^2.0.0
  permission_handler: ^11.0.1

  sqflite: ^2.3.0
  path: ^1.8.3
  # file_picker: ^6.1.1
  excel: ^4.0.2
  pdf: ^3.10.7
  printing: ^5.11.0
  open_filex: ^4.3.2
  share_plus: ^7.2.1
  qr_flutter: ^4.1.0

  syncfusion_flutter_charts: ^33.2.4 # Gráficos modernos
  intl: ^0.20.2
  utm: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/btns/
